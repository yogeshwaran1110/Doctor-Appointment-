<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Appointment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            width: 450px;
            max-width: 100%;
            margin: auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        .update-btn {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .update-btn:hover {
            background-color: #218838;
        }

        .back-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #6c757d;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
        }

        .back-btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Update Appointment</h2>

        <form method="POST">

            <label for="patient_name">Patient Name</label>
            <input
                type="text"
                id="patient_name"
                name="patient_name"
                value="{{ patient.patient_name }}"
                required
            >

            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                name="age"
                value="{{ patient.age }}"
                min="1"
                max="120"
                required
            >

            <label for="appointment_date">Appointment Date</label>
            <input
                type="date"
                id="appointment_date"
                name="appointment_date"
                value="{{ patient.appointment_date }}"
                required
            >

            <label for="appointment_time">Appointment Time</label>
            <input
                type="time"
                id="appointment_time"
                name="appointment_time"
                value="{{ patient.appointment_time }}"
                required
            >

            <label for="phone_number">Phone Number</label>
            <input
                type="tel"
                id="phone_number"
                name="phone_number"
                value="{{ patient.phone_number }}"
                maxlength="15"
                required
            >

            <label for="token_number">Token Number</label>
            <input
                type="number"
                id="token_number"
                name="token_number"
                value="{{ patient.token_number }}"
                min="1"
                required
            >

            <button type="submit" class="update-btn">
                Update Appointment
            </button>

            <a href="/appointments" class="back-btn">
                Back to Appointments
            </a>

        </form>

    </div>

</body>

</html>
