<!DOCTYPE html>
<html>
<head>
    <title>Appointments</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 95%;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #007bff;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        button {
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        .edit-btn {
            background-color: #28a745;
        }

        .edit-btn:hover {
            background-color: #218838;
        }

        .delete-btn {
            background-color: #dc3545;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }

        a {
            text-decoration: none;
        }
        .back-btn{
            background-color: #007bff;
            font-weight: bolder;
            margin-top: 20px;
            padding: 10px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h2>All Appointments</h2>

        <table>

            <tr>
                <th>ID</th>
                <th>Patient Name</th>
                <th>Age</th>
                <th>Date</th>
                <th>Time</th>
                <th>Phone</th>
                <th>Token</th>
                <th>Action</th>
            </tr>

            {% for patient in appointments %}

            <tr>
                <td>{{ patient.patient_id }}</td>
                <td>{{ patient.patient_name }}</td>
                <td>{{ patient.age }}</td>
                <td>{{ patient.appointment_date }}</td>
                <td>{{ patient.appointment_time }}</td>
                <td>{{ patient.phone_number }}</td>
                <td>{{ patient.token_number }}</td>

                <td>
                    <a href="/edit/{{ patient.patient_id }}">
                        <button class="edit-btn">Edit</button>
                    </a>

                    <a href="/delete/{{ patient.patient_id }}"
                       onclick="return confirm('Are you sure you want to delete this appointment?')">
                        <button class="delete-btn">Delete</button>
                    </a>
                </td>
            </tr>

            {% endfor %}

        </table>

        <center>
            <a href="/"><button class="back-btn">BACK</button></a>
        </center>
    </div>

</body>
</html>
