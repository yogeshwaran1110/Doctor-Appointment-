<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Appointment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .view-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #28a745;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .view-btn:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Doctor Appointment Form</h2>

        <form id="appointmentForm" method="POST">

            <label for="patient_name">Patient Name</label>
            <input type="text" id="patient_name" name="patient_name" placeholder="Enter patient name" required>

            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="Enter age" min="1" max="120" required>

            <label for="appointment_date">Appointment Date</label>
            <input type="date" id="appointment_date" name="appointment_date" required>

            <label for="appointment_time">Appointment Time</label>
            <input type="time" id="appointment_time" name="appointment_time" required>

            <label for="phone_number">Phone Number</label>
            <input type="tel" id="phone_number" name="phone_number" placeholder="Enter phone number" maxlength="15"
                required>

            <label for="token_number">Token Number</label>
            <input type="number" id="token_number" name="token_number" placeholder="Enter token number" min="1"
                required>

            <a href="/appointments">
                <button type="submit">Book Appointment</button>
            </a>

            <a href="/appointments" class="view-btn">
                View All Appointments
            </a>

        </form>

    </div>

</body>

</html>
